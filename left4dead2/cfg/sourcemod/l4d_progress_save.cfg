// =====================================================
// L4D2 进度存读档插件 (l4d2_progress_save) 默认配置
// SourceMod 自动生成,可自行修改后保存
// =====================================================

// 总开关
l4d_progress_enable 1

// 仅允许在出生安全区保存
l4d_progress_save_in_safearea_only 1

// 读档后自动 EndScenario 重启本图
l4d_progress_auto_restart 1

// round_start_post_nav 后延迟套家底秒数(等 bots 铺队)
l4d_progress_restore_delay 1.5

// 读档投票时长(秒)
l4d_progress_vote_time 20

// 读档时把 bots_limit 对齐到存档人数
l4d_progress_align_botslimit 1

// 调试日志
l4d_progress_debug 0
